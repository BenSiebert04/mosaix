<html>
    <head>
        <meta charset="utf-8" />
        <title>Mosaix app audio harness</title>
    </head>
    <body>
        <script>
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // Amplitude of a tone in a block, allowing for a slightly different
            // clock (±3 Hz): a clean tone measures its amplitude in every block
            function blockLevel(x, frequency, rate) {
                let best = 0;
                for (let df = -3; df <= 3; df += 0.5) {
                    const k = (2 * Math.PI * (frequency + df)) / rate;
                    const c = 2 * Math.cos(k);
                    let s1 = 0;
                    let s2 = 0;
                    for (const v of x) {
                        const s = v + c * s1 - s2;
                        s2 = s1;
                        s1 = s;
                    }
                    best = Math.max(best, (2 * Math.sqrt(Math.max(s1 * s1 + s2 * s2 - c * s1 * s2, 0))) / x.length);
                }
                return best;
            }

            // Per 100 ms block: the level of each tone and how much of the
            // block's power the tones make up (the rest is noise or cracks)
            function analyse(signal, frequencies, rate = 48000) {
                const size = rate / 10;
                const blocks = [];
                for (let b = 0; b + size <= signal.length; b += size) {
                    const x = signal.subarray(b, b + size);
                    const levels = frequencies.map((f) => blockLevel(x, f, rate));
                    let power = 0;
                    for (const v of x) power += v * v;
                    power /= x.length;
                    const tonePower = levels.reduce((p, l) => p + (l * l) / 2, 0);
                    blocks.push({ levels, power, clean: power > 1e-6 ? tonePower / power : 1 });
                }
                const median = (values) => values.sort((a, b) => a - b)[values.length >> 1];
                const round = (v) => Math.round(v * 1000) / 1000;
                const result = { blocks: blocks.length };
                frequencies.forEach((f, i) => (result[`t${f}`] = round(median(blocks.map((b) => b.levels[i])))));
                result.cleanMedian = round(median(blocks.map((b) => b.clean)));
                result.unclean = blocks.filter((b) => b.clean < 0.9).length;
                // Which blocks are off, and what they contain (for diagnosis)
                result.off = blocks
                    .map((b, i) => ({ i, clean: round(b.clean), levels: b.levels.map(round), rms: round(Math.sqrt(b.power)) }))
                    .filter((b) => b.clean < 0.9);
                return result;
            }

            // This app's own sound (stands for the call's sound)
            function startOwnTone(frequency) {
                const c = new AudioContext();
                const o = c.createOscillator();
                o.frequency.value = frequency;
                const g = c.createGain();
                g.gain.value = 0.5;
                o.connect(g).connect(c.destination);
                o.start();
                return c.resume();
            }

            // Shares the screen (the main process picks the source) and measures
            // the tones in its sound, taken as Mosaix takes it: without voice
            // processing, in stereo
            async function measureShare() {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 },
                });
                const [track] = stream.getAudioTracks();
                if (!track) {
                    stream.getTracks().forEach((t) => t.stop());
                    return { audioTrack: false };
                }
                const ctx = new AudioContext({ sampleRate: 48000 });
                const source = ctx.createMediaStreamSource(new MediaStream([track]));
                // Recorded on the audio thread: a ScriptProcessorNode runs on the
                // main thread and loses sound when the page is busy
                const recorderCode = `
                    registerProcessor("recorder", class extends AudioWorkletProcessor {
                        process(inputs) {
                            const channel = inputs[0][0];
                            if (channel) this.port.postMessage(channel.slice());
                            return true;
                        }
                    });`;
                await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([recorderCode], { type: "text/javascript" })));
                const recorder = new AudioWorkletNode(ctx, "recorder", { numberOfOutputs: 0 });
                const chunks = [];
                recorder.port.onmessage = (e) => chunks.push(e.data);
                source.connect(recorder);
                await sleep(5000);
                stream.getTracks().forEach((t) => t.stop());
                await ctx.close();
                const all = new Float32Array(chunks.reduce((n, c) => n + c.length, 0));
                let o = 0;
                for (const c of chunks) {
                    all.set(c, o);
                    o += c.length;
                }
                return {
                    audioTrack: true,
                    channels: track.getSettings().channelCount,
                    ...analyse(all.subarray(48000), [440, 660, 880]), // skip the first second
                };
            }
        </script>
    </body>
</html>
